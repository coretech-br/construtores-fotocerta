<!-- ============================================================
     FOTO CERTA - PAGINA INTERMEDIARIA (ex: /iframe-agendamento-natal)
     ONDE COLAR: campo Tag Body da pagina (substituir todo o conteudo)
     Funcao: quando esta pagina esta embutida por iframe na hospedeira
     (mesmo dominio), ajusta a altura do iframe automaticamente para
     o conteudo aparecer inteiro, sem barra de rolagem.
     Tag Head da pagina: vazia.
     ============================================================ -->

<script>
(function () {
  /* so age quando estiver dentro do iframe (window.frameElement existe) */
  function ajustarAltura() {
    if (!window.frameElement) return;
    window.frameElement.style.height = document.documentElement.scrollHeight + 'px';
  }

  window.addEventListener('load', ajustarAltura);
  window.addEventListener('resize', ajustarAltura);

  if (window.ResizeObserver) {
    new ResizeObserver(ajustarAltura).observe(document.body);
  }

  ajustarAltura();
  setTimeout(ajustarAltura, 300);
  setTimeout(ajustarAltura, 1000);
  setTimeout(ajustarAltura, 2500);
})();
</script>
