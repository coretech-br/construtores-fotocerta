<!-- ============================================================
     FOTO CERTA - PAGINA INTERMEDIARIA (ex: /iframe-agendamento-natal)
     ONDE COLAR: componente HTML da pagina
     Funcao: embute o calendario TidyCal e expande/recolhe o espaco
     automaticamente quando o modal de reserva abre/fecha (sem barra
     de rolagem interna), com alturas separadas p/ desktop e celular.
     Como funciona: o iframe-resizer do TidyCal emite postMessages;
     'scrollToOffset' = modal abriu -> expandir; 'mutationObserver'
     (apos janela surda de 800ms) = modal fechou -> recolher.
     ============================================================ -->

<div class="tidycal-embed" data-path="fotocerta/natal-2026"></div>
<script src="https://asset-tidycal.b-cdn.net/js/embed.js" async></script>

<style>
  iframe.tidycal-embed { transition: min-height 0.25s ease; }
</style>

<script>
(function () {
  var ALTURA_DESKTOP = '2350px';  /* altura do espaco com o modal aberto no computador - calibrar se o modal cortar */
  var ALTURA_MOBILE  = '2700px';  /* altura com o modal aberto no celular - calibrar no aparelho se o modal cortar */
  var LARGURA_MOBILE = 700;       /* telas ate este tamanho usam a altura mobile */

  var modalAberto = false;
  var ignorarMutacoesAte = 0;

  function frame() { return document.querySelector('iframe.tidycal-embed'); }

  function alturaAlvo() {
    return (window.innerWidth <= LARGURA_MOBILE) ? ALTURA_MOBILE : ALTURA_DESKTOP;
  }

  function expandir() {
    var f = frame(); if (!f) return;
    f.style.setProperty('min-height', alturaAlvo(), 'important');
  }

  function recolher() {
    var f = frame(); if (!f) return;
    f.style.removeProperty('min-height');
  }

  window.addEventListener('resize', function () {
    if (modalAberto) expandir();
  });

  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://tidycal.com') return;
    if (typeof e.data !== 'string') return;
    if (e.data.indexOf('[iFrameSizer]') !== 0) return;

    var tipo = e.data.split(':').pop();

    if (tipo === 'scrollToOffset') {
      modalAberto = true;
      ignorarMutacoesAte = Date.now() + 800;
      expandir();
      return;
    }

    if (modalAberto && tipo === 'mutationObserver' && Date.now() > ignorarMutacoesAte) {
      modalAberto = false;
      recolher();
    }
  });
})();
</script>
