<!-- ============================================================
     FOTO CERTA - TITULO DE NATAL COM BRILHO E NEVE
     ONDE COLAR: um unico componente HTML da pagina.
     NAO vai no campo "CSS Customizado" do componente: ele aceita
     apenas propriedades soltas, e este efeito precisa de seletores,
     de @keyframes e de um script. Componente HTML aceita os tres.

     Adaptado de um exemplo de CodePen. O que MUDOU, e por que:
     1. O original estilizava BODY (fundo azul, height:100vh e
        overflow:hidden). Colado assim, ele pintaria o site inteiro
        de azul e MATARIA A ROLAGEM de toda a pagina. Aqui tudo esta
        preso ao palco deste componente.
     2. O original dependia de jQuery. Nao dependemos: sao seis
        linhas de JavaScript comum.
     3. Os GIFs de brilho vinham do S3 do CodePen. Hospede os seus
        (Alboom) e troque os enderecos abaixo: hotlink de asset dos
        outros some sem aviso.
     4. Sem GIF, o texto do original ficava INVISIVEL (fundo recortado
        no texto + preenchimento transparente). Aqui a cor solida e a
        camada de baixo: se o GIF nao carregar, as letras aparecem
        douradas e azuis do mesmo jeito.
     5. Entrou a guarda de movimento reduzido.
     ============================================================ -->

/* O titulo. Div, e nao <h1>: o Manual do Prosite manda usar so div
   dentro de componente. text-align:left nao entra aqui porque este
   bloco QUER o texto centralizado. */
#fcnv-palco .fcnv-titulo{
  position:relative;
  z-index:1;
  margin:0;
  padding:0 16px;
  width:100%;
  text-align:center;
  line-height:1.1;
  font-size:var(--fcnv-tamanho);
  font-weight:700;
  letter-spacing:1px;
  font-family:"Mountains of Christmas","Brush Script MT",cursive;
}
/* A COR SOLIDA E A CAMADA DE BAIXO. No original, o recorte no texto
   com preenchimento transparente deixava as letras INVISIVEIS se o
   GIF nao carregasse. Aqui o gradiente solido fica por baixo do GIF:
   sem GIF, as letras aparecem na cor solida. */
#fcnv-palco .fcnv-ouro{
  color:var(--fcnv-ouro);
  background-image:var(--fcnv-gif-ouro), linear-gradient(var(--fcnv-ouro), var(--fcnv-ouro));
  background-repeat:repeat;
}
#fcnv-palco .fcnv-azul{
  color:var(--fcnv-azul);
  background-image:var(--fcnv-gif-azul), linear-gradient(var(--fcnv-azul), var(--fcnv-azul));
  background-repeat:repeat;
}
/* O recorte so entra onde ele funciona. Fora do @supports, as letras
   ficam na cor solida -- que ja esta declarada acima. */
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  #fcnv-palco .fcnv-ouro, #fcnv-palco .fcnv-azul{
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }
}

/* Movimento reduzido: a neve para e continua a vista. Vale so para a
   animacao deste bloco -- nada mais do site e tocado.
   LIMITE HONESTO: GIF animado nao para por CSS. Se este ponto
   importar, deixe os dois enderecos de GIF vazios e use as cores
   solidas, que sao estaticas. */
@media (prefers-reduced-motion: reduce){
  #fcnv-palco .fcnv-neve{animation:none}
}

<script>
(function () {
  /* Sem jQuery. O original dependia dele para seis linhas de trabalho,
     e depender de uma biblioteca que pode nao estar na pagina e uma
     chance a mais de o bloco nascer quebrado.
     Cada letra vira um span, alternando dourado e azul. Espaco fica
     como esta -- envolve-lo criaria caixas vazias com fundo. */
  function pintar(el) {
    if (!el || el.getAttribute('data-fcnv') === 'ok') return;
    var texto = el.textContent, i, ch, sp;
    var frag = document.createDocumentFragment();
    var n = 0;
    for (i = 0; i < texto.length; i++) {
      ch = texto.charAt(i);
      if (ch === ' ') { frag.appendChild(document.createTextNode(' ')); continue; }
      sp = document.createElement('span');
      /* textContent, nunca innerHTML: o titulo e texto, e texto entra
         como texto. */
      sp.textContent = ch;
      sp.className = (n % 2 === 0) ? 'fcnv-ouro' : 'fcnv-azul';
      frag.appendChild(sp);
      n++;
    }
    el.textContent = '';
    el.appendChild(frag);
    el.setAttribute('data-fcnv', 'ok');
  }
  function iniciar() { pintar(document.getElementById('fcnv-titulo')); }
  if (document.getElementById('fcnv-titulo')) iniciar();
  else document.addEventListener('DOMContentLoaded', iniciar);
})();
</script>
